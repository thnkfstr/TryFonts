name: Baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  CORE_TEST_PROJECT: tests/TryFonts.Core.Tests/TryFonts.Core.Tests.csproj

jobs:
  core-tests:
    name: Core Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore core tests
        run: dotnet restore ${{ env.CORE_TEST_PROJECT }}
      - name: Build core tests
        run: >
          dotnet build ${{ env.CORE_TEST_PROJECT }}
          --no-restore
          --configuration Release
      - name: Run core tests
        run: >
          dotnet test ${{ env.CORE_TEST_PROJECT }}
          --no-build
          --configuration Release
