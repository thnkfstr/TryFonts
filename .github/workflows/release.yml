name: Release

on:
  # Run manually from the Actions tab to produce release artifacts
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.0.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write   # needed to create GitHub Releases

env:
  APP_PROJECT: src/TryFonts.App/TryFonts.App.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── Windows portable EXE ────────────────────────────────────────────────────
  release-windows:
    name: Windows x64 EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore TryFonts.sln

      - name: Run tests
        run: dotnet test TryFonts.sln --no-restore --configuration Release

      - name: Publish (unsigned portable EXE)
        run: >
          dotnet publish ${{ env.APP_PROJECT }}
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=true
          -p:DebugType=embedded
          -p:Version=${{ github.event.inputs.version }}
          --output publish/win-x64

      - name: Rename artifact
        run: |
          Move-Item publish/win-x64/TryFonts.exe `
            publish/TryFonts-windows-x64-${{ github.event.inputs.version }}.exe

      # ── Optional: Authenticode signing ──────────────────────────────────────
      # Uncomment and add SIGNING_CERT_BASE64 + SIGNING_CERT_PASSWORD secrets
      # to sign the EXE.  Without secrets the EXE is unsigned and SmartScreen
      # will warn on first run.
      #
      # - name: Sign EXE (Authenticode)
      #   if: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
      #   shell: pwsh
      #   run: |
      #     $cert = [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_BASE64 }}")
      #     Set-Content -Path cert.pfx -Value $cert -Encoding Byte
      #     & signtool sign /f cert.pfx /p "${{ secrets.SIGNING_CERT_PASSWORD }}" `
      #                     /td sha256 /fd sha256 /tr http://timestamp.digicert.com `
      #                     publish/TryFonts-windows-x64-${{ github.event.inputs.version }}.exe
      #     Remove-Item cert.pfx

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryFonts-windows-x64-${{ github.event.inputs.version }}
          path: publish/TryFonts-windows-x64-${{ github.event.inputs.version }}.exe

  # ── macOS arm64 DMG ─────────────────────────────────────────────────────────
  release-macos-arm64:
    name: macOS arm64 DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore TryFonts.sln

      - name: Run tests
        run: dotnet test TryFonts.sln --no-restore --configuration Release

      - name: Publish (arm64 binary)
        run: >
          dotnet publish ${{ env.APP_PROJECT }}
          --configuration Release
          --runtime osx-arm64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=true
          -p:DebugType=embedded
          -p:Version=${{ github.event.inputs.version }}
          --output publish/osx-arm64

      - name: Bundle into .app
        run: tools/bundle-macos-app.sh publish/osx-arm64/TryFonts osx-arm64

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Try Fonts" \
            -srcfolder publish/TryFonts.app \
            -ov -format UDZO \
            publish/TryFonts-macos-arm64-${{ github.event.inputs.version }}.dmg

      # ── Optional: Apple Developer ID signing + notarization ─────────────────
      # Add APPLE_DEVELOPER_ID, APPLE_CERT_BASE64, APPLE_CERT_PASSWORD,
      # APPLE_TEAM_ID, APPLE_NOTARY_USER, APPLE_NOTARY_PASSWORD secrets.
      # Without them the app is unsigned and macOS will show a first-run warning.
      #
      # - name: Sign and notarize
      #   if: ${{ secrets.APPLE_DEVELOPER_ID != '' }}
      #   run: tools/sign-notarize-macos.sh ...

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryFonts-macos-arm64-${{ github.event.inputs.version }}
          path: publish/TryFonts-macos-arm64-${{ github.event.inputs.version }}.dmg

  # ── macOS x64 DMG ───────────────────────────────────────────────────────────
  release-macos-x64:
    name: macOS x64 DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore TryFonts.sln

      - name: Run tests
        run: dotnet test TryFonts.sln --no-restore --configuration Release

      - name: Publish (x64 binary)
        run: >
          dotnet publish ${{ env.APP_PROJECT }}
          --configuration Release
          --runtime osx-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=true
          -p:DebugType=embedded
          -p:Version=${{ github.event.inputs.version }}
          --output publish/osx-x64

      - name: Bundle into .app
        run: tools/bundle-macos-app.sh publish/osx-x64/TryFonts osx-x64

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Try Fonts" \
            -srcfolder publish/TryFonts.app \
            -ov -format UDZO \
            publish/TryFonts-macos-x64-${{ github.event.inputs.version }}.dmg

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryFonts-macos-x64-${{ github.event.inputs.version }}
          path: publish/TryFonts-macos-x64-${{ github.event.inputs.version }}.dmg
